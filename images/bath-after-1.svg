<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Fresh, Clean Bathroom Background -->
  <rect width="600" height="400" fill="#F0F9FF"/>
  <!-- Clean tiles -->
  <g stroke="#E0F2FE" stroke-width="1.5">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
  </g>
  <!-- Restored Tub Contour (Pure White, Smooth) -->
  <path d="M50 160C50 150 60 140 75 140H525C540 140 550 150 550 160V220C550 320 460 370 300 370C140 370 50 320 50 220V160Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
  <!-- Deep Glossy Acrylic Cavity -->
  <ellipse cx="300" cy="240" rx="220" ry="100" fill="#FFFFFF"/>
  <ellipse cx="300" cy="255" rx="180" ry="70" fill="#F8FAFC"/>
  <!-- Mirror Glaze Reflections & Gradients -->
  <path d="M120 230 C200 210, 400 210, 480 230 C420 220, 180 220, 120 230 Z" fill="#E0F2FE" opacity="0.8"/>
  <path d="M140 250 C220 235, 380 235, 460 250 C400 242, 200 242, 140 250 Z" fill="#BAE6FD" opacity="0.6"/>
  <!-- Gleaming Highlights -->
  <path d="M100 170 Q300 155 500 170" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Sparkling clean Chrome Drain -->
  <circle cx="300" cy="285" r="12" fill="#E2E8F0" stroke="#0284C7" stroke-width="2"/>
  <circle cx="300" cy="285" r="7" fill="#0F172A"/>
  <!-- Sparkles -->
  <path d="M160 190 L164 200 L174 204 L164 208 L160 218 L156 208 L146 204 L156 200 Z" fill="#0284C7"/>
  <path d="M440 180 L443 188 L451 191 L443 194 L440 202 L437 194 L429 191 L437 188 Z" fill="#0284C7"/>
  <path d="M300 220 L303 226 L309 228 L303 230 L300 236 L297 230 L291 228 L297 226 Z" fill="#38BDF8"/>
  <path d="M220 260 L222 265 L227 267 L222 269 L220 274 L218 269 L213 267 L218 265 Z" fill="#0284C7"/>
  <!-- Badge: ПОСЛЕ -->
  <rect x="25" y="25" width="110" height="38" rx="8" fill="#10B981"/>
  <text x="80" y="50" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="18" text-anchor="middle">ПОСЛЕ</text>
</svg>
